name: Cypress E2E

on:
  push:
    branches:
      - main
      - chore/portfolio-quality-improvements
      - testes
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            web/package-lock.json

      - name: Install Cypress dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: server

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Compile backend
        run: npm run compile
        working-directory: server

      - name: Start backend
        run: |
          npm start > /tmp/vollmed-backend.log 2>&1 &
        working-directory: server

      - name: Start frontend
        run: |
          CI=false npm start > /tmp/vollmed-frontend.log 2>&1 &
        working-directory: web

      - name: Validate authenticated test credentials
        env:
          CYPRESS_EMAIL: ${{ secrets.CYPRESS_EMAIL }}
          CYPRESS_PASSWORD: ${{ secrets.CYPRESS_PASSWORD }}
        run: |
          if [ -z "$CYPRESS_EMAIL" ] || [ -z "$CYPRESS_PASSWORD" ]; then
            echo "::error::Configure CYPRESS_EMAIL and CYPRESS_PASSWORD in repository Actions secrets. Authenticated tests must not be silently skipped."
            exit 1
          fi

      - name: Run Cypress E2E
        uses: cypress-io/github-action@v6
        with:
          install: false
          wait-on: "http://localhost:3000,http://localhost:8080"
          wait-on-timeout: 120
          spec: |
            cypress/e2e/cadastro-sucesso.cy.js
            cypress/e2e/login-clinica.cy.js
            cypress/e2e/login-api.cy.js
            cypress/e2e/dashboard.cy.js
        env:
          CYPRESS_EMAIL: ${{ secrets.CYPRESS_EMAIL }}
          CYPRESS_PASSWORD: ${{ secrets.CYPRESS_PASSWORD }}

      - name: Upload test evidence and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vollmed-cypress-evidence
          path: |
            cypress/results
            cypress/videos
            cypress/screenshots
            /tmp/vollmed-backend.log
            /tmp/vollmed-frontend.log
          if-no-files-found: ignore
          retention-days: 7
