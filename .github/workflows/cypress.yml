name: Cypress E2E

on:
  push:
    branches:
      - main
      - chore/portfolio-quality-improvements
      - testes
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            web/package-lock.json

      - name: Install Cypress dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: server

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Start backend
        run: |
          npm start > /tmp/vollmed-backend.log 2>&1 &
        working-directory: server

      - name: Start frontend
        run: |
          CI=false npm start > /tmp/vollmed-frontend.log 2>&1 &
        working-directory: web

      - name: Run Cypress E2E
        uses: cypress-io/github-action@v6
        with:
          install: false
          wait-on: 'http://localhost:3000,http://localhost:8080'
          wait-on-timeout: 120
          spec: |
            cypress/e2e/cadastro-sucesso.cy.js
            cypress/e2e/login-clinica.cy.js
            cypress/e2e/dashboard.cy.js

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vollmed-cypress-evidence
          path: |
            cypress/results
            cypress/videos
            cypress/screenshots
            /tmp/vollmed-backend.log
            /tmp/vollmed-frontend.log
          if-no-files-found: ignore
          retention-days: 7
